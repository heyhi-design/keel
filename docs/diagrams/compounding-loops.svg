<svg width="100%" viewBox="0 0 680 624" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Keel: how it funnels into itself</title>
<desc>Three compounding loops. One, corrections: a mistake becomes a correction entry, which loads at every session start, keeps firing, and is promoted into a hard rule that joins the always-loaded core while the entry retires. Two, parameterization: the company profile fills the configuration and skills, a session runs them, you learn what to change, and the profile is refilled. Three, orientation: the work passes the Exit Gate, which forces propagation into the decision log and project state, which the next session reads to orient. The system's own output is its next input.</desc>
<!-- Keel · Figure 4 of 5: How it funnels into itself. See docs/architecture.md. -->

<style>
.d{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
.b{font-family:'Lora',Georgia,'Times New Roman',serif;}
.m{font-family:'DM Mono','SFMono-Regular',ui-monospace,'Cascadia Mono','Courier New',monospace;}
.paper{fill:#FAFAF5;}
.ink{fill:#1A1A1A;}.soft{fill:#6B6560;}.faint{fill:#8B857C;}
.panel{fill:#F2F0EA;stroke:#D8D2C6;stroke-width:1;}
.node{fill:#FBFAF6;stroke:#C8BFB3;stroke-width:1;}
.node-hot{fill:#FBFAF6;stroke:#FF3B30;stroke-width:1.5;}
.arr{stroke:#C8BFB3;stroke-width:1.5;fill:none;}
.arrhead{fill:#C8BFB3;}
.arc{stroke:#C8BFB3;stroke-width:1.5;fill:none;stroke-dasharray:3 3;}
.arc-hot{stroke:#FF3B30;stroke-width:1.5;fill:none;stroke-dasharray:3 3;}
.hot{fill:#FF3B30;}
.rule{stroke:#E4E0DA;stroke-width:1;}
@media (prefers-color-scheme:dark){
.paper{fill:#1A1A1A;}.ink{fill:#F3F0E8;}.soft{fill:#A8A399;}.faint{fill:#7E7970;}
.panel{fill:#242320;stroke:#3E3B34;}
.node{fill:#2E2C27;stroke:#4A473F;}
.node-hot{fill:#2E2C27;stroke:#FF5247;}
.arr{stroke:#4A473F;}.arrhead{fill:#4A473F;}
.arc{stroke:#4A473F;}.arc-hot{stroke:#FF5247;}.hot{fill:#FF5247;}
.rule{stroke:#332F2A;}
}
</style>

<rect class="paper" x="0" y="0" width="680" height="624"/>

<text class="m faint" x="40" y="36" font-size="10.5" letter-spacing="1.6">KEEL</text>
<text class="d ink" x="40" y="62" font-size="21" font-weight="600">How it funnels into itself</text>
<text class="b soft" x="40" y="84" font-size="12.5">Three loops. Each one makes the next session cheaper than the last.</text>

<!-- LOOP 01 · CORRECTIONS -->
<rect class="panel" x="40" y="100" width="600" height="128" rx="14"/>
<text class="m faint" x="62" y="124" font-size="10">01</text>
<text class="d ink" x="92" y="124" font-size="14" font-weight="600">Corrections</text>
<text class="b soft" x="92" y="141" font-size="11.5">A mistake becomes a correction. A correction becomes a rule.</text>
<g class="m ink" font-size="8.5" text-anchor="middle">
<rect class="node" x="62" y="152" width="96" height="32" rx="7"/><text x="110" y="172">a mistake</text>
<rect class="node" x="177" y="152" width="96" height="32" rx="7"/><text x="225" y="166">a correction</text><text x="225" y="178">entry</text>
<rect class="node" x="292" y="152" width="96" height="32" rx="7"/><text x="340" y="166">loads at every</text><text x="340" y="178">session start</text>
<rect class="node" x="407" y="152" width="96" height="32" rx="7"/><text x="455" y="166">it keeps firing</text><text x="455" y="178">≥5 times</text>
<rect class="node-hot" x="522" y="152" width="96" height="32" rx="7"/><text x="570" y="166">a hard rule</text><text x="570" y="178">in your core</text>
</g>
<g><line class="arr" x1="158" y1="168" x2="171" y2="168"/><polygon class="arrhead" points="171,164 171,172 177,168"/></g>
<g><line class="arr" x1="273" y1="168" x2="286" y2="168"/><polygon class="arrhead" points="286,164 286,172 292,168"/></g>
<g><line class="arr" x1="388" y1="168" x2="401" y2="168"/><polygon class="arrhead" points="401,164 401,172 407,168"/></g>
<g><line class="arr" x1="503" y1="168" x2="516" y2="168"/><polygon class="arrhead" points="516,164 516,172 522,168"/></g>
<path class="arc-hot" d="M 570 184 C 570 210, 340 210, 340 190"/>
<polygon class="hot" points="336,190 344,190 340,184"/>
<text class="m hot" x="455" y="220" font-size="8.5" text-anchor="middle">promoted · the rule joins the always-loaded core, the entry retires</text>

<!-- LOOP 02 · PARAMETERIZATION -->
<rect class="panel" x="40" y="248" width="600" height="128" rx="14"/>
<text class="m faint" x="62" y="272" font-size="10">02</text>
<text class="d ink" x="92" y="272" font-size="14" font-weight="600">Parameterization</text>
<text class="b soft" x="92" y="289" font-size="11.5">Your profile fills the system. What the system teaches you refills the profile.</text>
<g class="m ink" font-size="8.5" text-anchor="middle">
<rect class="node" x="62" y="300" width="124" height="32" rx="7"/><text x="124" y="320">company profile</text>
<rect class="node" x="206" y="300" width="124" height="32" rx="7"/><text x="268" y="314">configuration</text><text x="268" y="326">+ skills</text>
<rect class="node" x="350" y="300" width="124" height="32" rx="7"/><text x="412" y="320">a session runs</text>
<rect class="node" x="494" y="300" width="124" height="32" rx="7"/><text x="556" y="314">you learn what</text><text x="556" y="326">to change</text>
</g>
<g><line class="arr" x1="186" y1="316" x2="200" y2="316"/><polygon class="arrhead" points="200,312 200,320 206,316"/></g>
<g><line class="arr" x1="330" y1="316" x2="344" y2="316"/><polygon class="arrhead" points="344,312 344,320 350,316"/></g>
<g><line class="arr" x1="474" y1="316" x2="488" y2="316"/><polygon class="arrhead" points="488,312 488,320 494,316"/></g>
<path class="arc" d="M 556 332 C 556 358, 124 358, 124 338"/>
<polygon class="arrhead" points="120,338 128,338 124,332"/>
<text class="m soft" x="340" y="368" font-size="8.5" text-anchor="middle">change the profile and everything downstream recalibrates</text>

<!-- LOOP 03 · ORIENTATION -->
<rect class="panel" x="40" y="396" width="600" height="128" rx="14"/>
<text class="m faint" x="62" y="420" font-size="10">03</text>
<text class="d ink" x="92" y="420" font-size="14" font-weight="600">Orientation</text>
<text class="b soft" x="92" y="437" font-size="11.5">This session's record is the next session's starting context.</text>
<g class="m ink" font-size="8.5" text-anchor="middle">
<rect class="node" x="62" y="448" width="124" height="32" rx="7"/><text x="124" y="468">the work</text>
<rect class="node" x="206" y="448" width="124" height="32" rx="7"/><text x="268" y="462">the Exit Gate</text><text x="268" y="474">forces propagation</text>
<rect class="node" x="350" y="448" width="124" height="32" rx="7"/><text x="412" y="462">decision log</text><text x="412" y="474">+ project state</text>
<rect class="node" x="494" y="448" width="124" height="32" rx="7"/><text x="556" y="462">the next session</text><text x="556" y="474">reads them</text>
</g>
<g><line class="arr" x1="186" y1="464" x2="200" y2="464"/><polygon class="arrhead" points="200,460 200,468 206,464"/></g>
<g><line class="arr" x1="330" y1="464" x2="344" y2="464"/><polygon class="arrhead" points="344,460 344,468 350,464"/></g>
<g><line class="arr" x1="474" y1="464" x2="488" y2="464"/><polygon class="arrhead" points="488,460 488,468 494,464"/></g>
<path class="arc" d="M 556 480 C 556 506, 124 506, 124 486"/>
<polygon class="arrhead" points="120,486 128,486 124,480"/>
<text class="m soft" x="340" y="516" font-size="8.5" text-anchor="middle">nothing gets re-derived · the record orients what comes next</text>

<line class="rule" x1="40" y1="552" x2="640" y2="552"/>
<text class="d ink" x="40" y="582" font-size="16" font-weight="600">The system's own output is its next input.</text>
<text class="m faint" x="40" y="606" font-size="9.5">Loops compound only if you close them. Every arc here is a discipline someone has to keep.</text>
</svg>
