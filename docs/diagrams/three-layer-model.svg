<svg width="100%" viewBox="0 0 680 574" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Keel: the three-layer model</title>
<desc>Three stacked layers. Top: Deployment (profile and skills) is yours, extended most. Middle: Configuration (os/) is yours once filled in, the IP-bearing layer. A crimson dashed line marks the boundary between owned and rented. Bottom: Runtime (agent loop, tools, permissions, sandbox, transcript) is rented from your agent tool and swappable without touching the layers above.</desc>
<!-- Keel · Figure 1 of 5: The three-layer model. See docs/architecture.md. -->

<style>
.d{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
.b{font-family:'Lora',Georgia,'Times New Roman',serif;}
.m{font-family:'DM Mono','SFMono-Regular',ui-monospace,'Cascadia Mono','Courier New',monospace;}
.paper{fill:#FAFAF5;}
.ink{fill:#1A1A1A;}.soft{fill:#6B6560;}.faint{fill:#8B857C;}
.dep-t{fill:#575235;}.cfg-t{fill:#1F01B9;}.rt-t{fill:#57534C;}
.dep-box{fill:#EDEBDD;stroke:#CBC5A6;stroke-width:1;}
.cfg-box{fill:#ECEAF6;stroke:#C3BAE6;stroke-width:1;}
.rt-box{fill:#ECEAE3;stroke:#CFC8BC;stroke-width:1;}
.dep-chip{fill:#FBFAF6;stroke:#CBC5A6;stroke-width:1;}
.cfg-chip{fill:#FBFAF6;stroke:#C3BAE6;stroke-width:1;}
.rt-chip{fill:#FBFAF6;stroke:#CFC8BC;stroke-width:1;}
.seam-line{stroke:#FF3B30;stroke-width:1.5;stroke-dasharray:2 4;}
.seam-pill{fill:#FAFAF5;stroke:#FF3B30;stroke-width:1.5;}
@media (prefers-color-scheme:dark){
.paper{fill:#1A1A1A;}.ink{fill:#F3F0E8;}.soft{fill:#A8A399;}.faint{fill:#7E7970;}
.dep-t{fill:#CBC49E;}.cfg-t{fill:#BBB0F0;}.rt-t{fill:#B8B2A6;}
.dep-box{fill:#26241A;stroke:#464230;}.cfg-box{fill:#201A38;stroke:#3F3670;}.rt-box{fill:#242320;stroke:#3E3B34;}
.dep-chip{fill:#2E2C27;stroke:#464230;}.cfg-chip{fill:#2E2C27;stroke:#3F3670;}.rt-chip{fill:#2E2C27;stroke:#3E3B34;}
.seam-line{stroke:#FF5247;}.seam-pill{fill:#1A1A1A;stroke:#FF5247;}
}
</style>

<rect class="paper" x="0" y="0" width="680" height="574"/>

<!-- title block -->
<text class="m faint" x="40" y="36" font-size="10.5" letter-spacing="1.6">KEEL</text>
<text class="d ink" x="40" y="62" font-size="21" font-weight="600">The three-layer model</text>
<text class="b soft" x="40" y="84" font-size="12.5">What you own, what you rent, and the line between them.</text>

<!-- DEPLOYMENT (top) -->
<rect class="dep-box" x="40" y="96" width="600" height="108" rx="14"/>
<text class="d dep-t" x="62" y="126" font-size="18" font-weight="600">Deployment</text>
<text class="m faint" x="224" y="126" font-size="10.5">profile/ · skills/</text>
<rect class="dep-chip" x="490" y="110" width="134" height="22" rx="11"/>
<text class="m dep-t" x="557" y="125" text-anchor="middle" font-size="9.5">yours · extend most</text>
<text class="b soft" x="62" y="166" font-size="12.5">The intake profile and starter skills that make the system yours, not generic.</text>
<g class="m dep-t" font-size="9.5" text-anchor="middle">
<rect class="dep-chip" x="62" y="176" width="112" height="21" rx="6"/><text x="118" y="190.5">company profile</text>
<rect class="dep-chip" x="182" y="176" width="58" height="21" rx="6"/><text x="211" y="190.5">intake</text>
<rect class="dep-chip" x="248" y="176" width="116" height="21" rx="6"/><text x="306" y="190.5">5 starter skills</text>
<rect class="dep-chip" x="372" y="176" width="104" height="21" rx="6"/><text x="424" y="190.5">skill registry</text>
</g>

<!-- CONFIGURATION (middle) -->
<rect class="cfg-box" x="40" y="218" width="600" height="140" rx="14"/>
<text class="d cfg-t" x="62" y="248" font-size="18" font-weight="600">Configuration</text>
<text class="m faint" x="224" y="248" font-size="10.5">os/</text>
<rect class="cfg-chip" x="474" y="232" width="150" height="22" rx="11"/>
<text class="m cfg-t" x="549" y="247" text-anchor="middle" font-size="9.5">yours once filled · the IP</text>
<text class="b soft" x="62" y="288" font-size="12.5">Identity, binding principles, session discipline, and corrections memory.</text>
<g class="m cfg-t" font-size="9.5" text-anchor="middle">
<rect class="cfg-chip" x="62" y="300" width="100" height="21" rx="6"/><text x="112" y="314.5">agent context</text>
<rect class="cfg-chip" x="170" y="300" width="140" height="21" rx="6"/><text x="240" y="314.5">operating principles</text>
<rect class="cfg-chip" x="318" y="300" width="100" height="21" rx="6"/><text x="368" y="314.5">session rules</text>
<rect class="cfg-chip" x="62" y="328" width="92" height="21" rx="6"/><text x="108" y="342.5">corrections</text>
<rect class="cfg-chip" x="162" y="328" width="96" height="21" rx="6"/><text x="210" y="342.5">decision log</text>
<rect class="cfg-chip" x="266" y="328" width="96" height="21" rx="6"/><text x="314" y="342.5">project state</text>
<rect class="cfg-chip" x="370" y="328" width="72" height="21" rx="6"/><text x="406" y="342.5">dispatch</text>
</g>

<!-- OWNERSHIP SEAM -->
<line class="seam-line" x1="40" y1="380" x2="640" y2="380"/>
<text class="m soft" x="40" y="374" font-size="9.5">OWNED · yours once you fill it in</text>
<text class="m soft" x="40" y="396" font-size="9.5">RENTED · from your agent tool</text>
<rect class="seam-pill" x="474" y="369" width="166" height="22" rx="11"/>
<text class="m ink" x="557" y="384" text-anchor="middle" font-size="9.5">the line that matters</text>

<!-- RUNTIME (bottom) -->
<rect class="rt-box" x="40" y="402" width="600" height="108" rx="14"/>
<text class="d rt-t" x="62" y="432" font-size="18" font-weight="600">Runtime</text>
<text class="m faint" x="224" y="432" font-size="10.5">not shipped here</text>
<rect class="rt-chip" x="558" y="416" width="66" height="22" rx="11"/>
<text class="m rt-t" x="591" y="431" text-anchor="middle" font-size="9.5">rented</text>
<rect class="rt-chip" x="444" y="416" width="104" height="22" rx="11"/>
<text class="m rt-t" x="496" y="431" text-anchor="middle" font-size="9.5">⇄  swappable</text>
<text class="b soft" x="62" y="472" font-size="12.5">Claude Code, Cowork, or a compatible agent runtime. You bring your own.</text>
<g class="m rt-t" font-size="9.5" text-anchor="middle">
<rect class="rt-chip" x="62" y="482" width="92" height="21" rx="6"/><text x="108" y="496.5">agent loop</text>
<rect class="rt-chip" x="162" y="482" width="56" height="21" rx="6"/><text x="190" y="496.5">tools</text>
<rect class="rt-chip" x="226" y="482" width="96" height="21" rx="6"/><text x="274" y="496.5">permissions</text>
<rect class="rt-chip" x="330" y="482" width="80" height="21" rx="6"/><text x="370" y="496.5">sandbox</text>
<rect class="rt-chip" x="418" y="482" width="88" height="21" rx="6"/><text x="462" y="496.5">transcript</text>
</g>

<!-- caption -->
<text class="b soft" x="40" y="536" font-size="12.5" font-style="italic">You rent the runtime, own the configuration once you fill it in, and extend the deployment.</text>
<text class="m faint" x="40" y="558" font-size="9.5">Provider-agnostic by design. Realized portability is real adaptation work, not a config flip.</text>
</svg>
