<!-- notes -->
<g class="m faint" font-size="9">
<text x="440" y="148">thin; it imports AGENTS.md</text>
<text x="440" y="170">you write this; it points at os/</text>
<text x="440" y="236">the Start Sequence</text>
<text x="440" y="302">active entries only</text>
<text x="440" y="324">yours only, by git email</text>
<text x="440" y="346">the newest entry only</text>
<text x="440" y="368">at session close</text>
<text x="340" y="500">not loaded · it fills the others</text>
<text x="340" y="566">not loaded · it's run, not read</text>
<text x="440" y="588">only the match loads</text>
