<!-- legend -->
<line class="rule" x1="40" y1="616" x2="640" y2="616"/>
<g class="m" font-size="8.5" text-anchor="middle">
<rect class="bd-always" x="62" y="634" width="52" height="17" rx="5"/><text class="bd-always-t" x="88" y="646">ALWAYS</text>
<rect class="bd-ondemand" x="300" y="634" width="68" height="17" rx="5"/><text class="soft" x="334" y="646">ON DEMAND</text>
<rect class="bd-search" x="62" y="662" width="74" height="17" rx="5"/><text class="soft" x="99" y="674">SEARCHABLE</text>
</g>
<g class="m soft" font-size="9">
<text x="124" y="646">every session</text>
<text x="378" y="646">when the task calls for it</text>
<text x="146" y="674">only the skill the registry matches</text>
</g>
<text class="m faint" x="380" y="674" font-size="9">indigo = Configuration · olive = Deployment</text>

<text class="b soft" x="40" y="708" font-size="12.5" font-style="italic">Five skills fit in a session. Forty don't, and the failure is quiet.</text>
<text class="m faint" x="40" y="732" font-size="9.5">Load classes are design intent. Your runtime honors them only if your context file says so.</text>
</svg>
