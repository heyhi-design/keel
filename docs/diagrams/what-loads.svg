<svg width="100%" viewBox="0 0 680 746" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Keel: what loads, and what doesn't</title>
<desc>A file tree of the scaffold with a load class on each entry. Always loaded every session: CLAUDE.md and the AGENTS.md it imports, the Start Sequence in os/session-start.md, agent-context, operating-principles, the active entries of the corrections registry, your own operator profile (the one matching your git email) and only the newest entry of your handoff file. On demand: session-rules, decision-log, project-state, dependency-graph. Searchable: the skills, of which only the one the registry matches ever loads. Not loaded: the company profile, which fills the other files, and the registry script, which is run rather than read.</desc>
<!-- Keel · Figure 2 of 5: What loads, and what doesn't. See docs/architecture.md. -->

<style>
.d{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
.b{font-family:'Lora',Georgia,'Times New Roman',serif;}
.m{font-family:'DM Mono','SFMono-Regular',ui-monospace,'Cascadia Mono','Courier New',monospace;}
.paper{fill:#FAFAF5;}
.ink{fill:#1A1A1A;}.soft{fill:#6B6560;}.faint{fill:#8B857C;}
.cfg-t{fill:#1F01B9;}.dep-t{fill:#575235;}
.bd-always{fill:#1A1A1A;stroke:none;}
.bd-always-t{fill:#FAFAF5;}
.bd-ondemand{fill:none;stroke:#C8BFB3;stroke-width:1;}
.bd-search{fill:none;stroke:#C8BFB3;stroke-width:1;stroke-dasharray:3 2;}
.rule{stroke:#E4E0DA;stroke-width:1;}
@media (prefers-color-scheme:dark){
.paper{fill:#1A1A1A;}.ink{fill:#F3F0E8;}.soft{fill:#A8A399;}.faint{fill:#7E7970;}
.cfg-t{fill:#BBB0F0;}.dep-t{fill:#CBC49E;}
.bd-always{fill:#F3F0E8;}.bd-always-t{fill:#1A1A1A;}
.bd-ondemand{stroke:#4A473F;}.bd-search{stroke:#4A473F;}
.rule{stroke:#332F2A;}
}
</style>

<rect class="paper" x="0" y="0" width="680" height="746"/>

<text class="m faint" x="40" y="36" font-size="10.5" letter-spacing="1.6">KEEL</text>
<text class="d ink" x="40" y="62" font-size="21" font-weight="600">What loads, and what doesn't</text>
<text class="b soft" x="40" y="84" font-size="12.5">Earn the Room, made concrete. Most of the scaffold never enters a session.</text>

